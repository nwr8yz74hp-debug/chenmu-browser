name: Windows validation

on:
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read project version for artifact names
        id: project-version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath 'CHENMU-Browser.csproj' -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unsafe or missing project version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run cross-platform logic tests
        shell: pwsh
        run: dotnet run --project tests/BrowserLogicTests.csproj -c Release

      - name: Run Windows home wallpaper visual tests
        shell: pwsh
        run: dotnet run --project tests/HomeVisualSmokeTests.csproj -c Release

      - name: Build application and Windows WebView2 smoke tests
        shell: pwsh
        run: dotnet build tests/WindowsWebView2SmokeTests.csproj -c Release

      - name: Run Windows WebView2 security and v1.5 feature smoke tests
        shell: pwsh
        timeout-minutes: 8
        run: dotnet run --project tests/WindowsWebView2SmokeTests.csproj -c Release

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build application and installer
        shell: pwsh
        run: .\build-windows.ps1

      - name: Smoke test silent upgrade from v1.0.13 in a spaced path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath 'CHENMU-Browser.csproj' -Raw
          $expectedVersion = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) { throw 'Project version was not found.' }
          $oldInstaller = Join-Path $env:TEMP 'CHENMU-Browser-v1.0.13-Setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/nwr8yz74hp-debug/chenmu-browser/releases/download/v1.0.13/CHENMU-Browser-Setup-x64.exe' -OutFile $oldInstaller
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\CHENMU Browser CI Space'
          $registryPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CHENMU Browser'
          $installArgs = '/S /D=' + $installDir

          function Invoke-SilentNsisInstaller([string]$InstallerPath, [string]$Arguments) {
            $startInfo = New-Object System.Diagnostics.ProcessStartInfo
            $startInfo.FileName = $InstallerPath
            $startInfo.Arguments = $Arguments
            $startInfo.UseShellExecute = $false
            $process = [System.Diagnostics.Process]::Start($startInfo)
            if ($null -eq $process) { throw "Could not start installer: $InstallerPath" }
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode): $InstallerPath" }
          }

          Invoke-SilentNsisInstaller $oldInstaller $installArgs
          $previous = Get-ItemProperty -LiteralPath $registryPath -Name @('DisplayVersion', 'InstallLocation')
          if ($previous.DisplayVersion -ne '1.0.13') { throw "Expected v1.0.13, got $($previous.DisplayVersion)." }

          $newInstaller = Join-Path $env:GITHUB_WORKSPACE 'dist\CHENMU-Browser-Setup-x64.exe'
          Invoke-SilentNsisInstaller $newInstaller $installArgs
          $installed = Get-ItemProperty -LiteralPath $registryPath -Name @('DisplayVersion', 'InstallLocation')
          if ($installed.DisplayVersion -ne $expectedVersion) { throw "Expected v$expectedVersion, got $($installed.DisplayVersion)." }
          $trimChars = [char[]]@([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar)
          $actualInstallDir = [System.IO.Path]::GetFullPath($installed.InstallLocation).TrimEnd($trimChars)
          $expectedInstallDir = [System.IO.Path]::GetFullPath($installDir).TrimEnd($trimChars)
          if (-not [string]::Equals($actualInstallDir, $expectedInstallDir, [System.StringComparison]::OrdinalIgnoreCase)) { throw "Installer used unexpected path: $actualInstallDir" }
          $app = Join-Path $installDir 'CHENMU Browser.exe'
          if (-not (Test-Path -LiteralPath $app)) { throw 'Installed browser executable is missing.' }
          $actualFileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($app).FileVersion
          if ($actualFileVersion -ne "$expectedVersion.0") { throw "Unexpected executable version: $actualFileVersion" }
          $notice = Join-Path $env:LOCALAPPDATA 'CHENMU Browser\update-notice.txt'
          if (-not (Test-Path -LiteralPath $notice) -or (Get-Content -LiteralPath $notice -Raw).Trim() -ne "v$expectedVersion") { throw 'Upgrade-complete notice marker was not created after a successful install.' }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'RELEASE_NOTES.md'))) { throw 'Installed release notes are missing.' }
          Write-Host "Silent upgrade smoke test passed: v1.0.13 -> v$expectedVersion at $actualInstallDir (FileVersion $actualFileVersion)."

      - name: Smoke test verified v1.5.4 to v1.5.5 silent upgrade
        if: ${{ steps.project-version.outputs.version == '1.5.5' }}
        shell: pwsh
        run: .\tests\Verify-UpgradeFromV154.ps1

      - name: Set up Python for packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package release assets without publishing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildAssets = @(
            'dist\CHENMU-Browser-Setup-x64.exe',
            'dist\CHENMU Browser.exe',
            'dist\WebView2Loader.dll'
          )
          foreach ($path in $buildAssets) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Build asset is missing before packaging: $path" }
            if ((Get-Item -LiteralPath $path).Length -le 0) { throw "Build asset is empty before packaging: $path" }
          }
          python package-release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release asset packaging failed.' }
          $required = @(
            'dist\CHENMU-Browser-Setup-x64.exe',
            'dist\CHENMU-Browser-Windows-x64.zip',
            'dist\CHENMU-Browser-source.zip',
            'dist\SHA256SUMS.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required release asset is missing after packaging: $path" }
            if ((Get-Item -LiteralPath $path).Length -le 0) { throw "Required release asset is empty after packaging: $path" }
          }
          $checksumLines = @(Get-Content -LiteralPath 'dist\SHA256SUMS.txt')
          if ($checksumLines.Count -ne 3) { throw "SHA256SUMS.txt must contain exactly three lines; got $($checksumLines.Count)." }
          $expected = @('CHENMU-Browser-Setup-x64.exe', 'CHENMU-Browser-Windows-x64.zip', 'CHENMU-Browser-source.zip')
          $seen = @{}
          foreach ($line in $checksumLines) {
            if ($line -notmatch '^([0-9a-fA-F]{64})  (.+)$') { throw "Malformed SHA256SUMS.txt line: $line" }
            $name = $Matches[2]
            if ($expected -notcontains $name) { throw "Unexpected checksum asset: $name" }
            if ($seen.ContainsKey($name)) { throw "Duplicate checksum asset: $name" }
            $seen[$name] = $Matches[1].ToLowerInvariant()
          }
          foreach ($name in $expected) {
            if (-not $seen.ContainsKey($name)) { throw "Missing checksum asset: $name" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path 'dist' $name)).Hash.ToLowerInvariant()
            if ($seen[$name] -ne $actual) { throw "Checksum mismatch for $name" }
          }

      - name: Normalize running-app screenshot filename
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = 'test-artifacts'
          if (-not (Test-Path -LiteralPath $directory -PathType Container)) { return }
          $screenshots = @(Get-ChildItem -LiteralPath $directory -File -Filter '*.png')
          if ($screenshots.Count -eq 1) {
            $target = Join-Path $directory "CHENMU-Browser-v${{ steps.project-version.outputs.version }}-running-app.png"
            Move-Item -LiteralPath $screenshots[0].FullName -Destination $target -Force
          }

      - name: Upload genuine running-app screenshot
        if: always() && steps.project-version.outcome == 'success' && hashFiles('test-artifacts/CHENMU-Browser-v*-running-app.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: chenmu-browser-v${{ steps.project-version.outputs.version }}-running-app-screenshot
          path: test-artifacts/CHENMU-Browser-v${{ steps.project-version.outputs.version }}-running-app.png
          if-no-files-found: error
